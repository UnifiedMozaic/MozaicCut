# 配布の形（node tools/mozcut.mjs package）を Windows（x64）と macOS（arm64）で作り、成果物（artifact）として置く。
#   Windows: dist/MozaicCut/ のフォルダ → MozaicCut-windows-x64
#   macOS:   dist/MozaicCut.app を ditto で zip にしたもの → MozaicCut-macos-arm64（ad-hoc の署名、公証なし）
# タグ v* の push のときだけ、release のジョブが GitHub Release を作り、zip 2 つと SHA256SUMS.txt を置く（docs/release.md）。
#   workflow_dispatch では Release を作らず、成果物だけ置く。
# 使うライブラリは .github/ci/install-deps.sh が揃え、actions/cache で次の実行に残す。
# コンパイラの UnifiedMozaic は別のリポジトリなので、隣に checkout する（版はリポジトリの変数 UM_REF、なければ main）。
# まだ GitHub で動かしたことはない（docs/build-mac.md の「GitHub Actions」を参照）。
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: MozaicCut
    steps:
      - uses: actions/checkout@v7
        with:
          path: MozaicCut

      # mozcut.mjs は UM_HOME がなければリポジトリの隣の UnifiedMozaic を探す
      - uses: actions/checkout@v7
        with:
          repository: UnifiedMozaic/UnifiedMozaic
          ref: ${{ vars.UM_REF || 'main' }}
          path: UnifiedMozaic

      - uses: actions/setup-node@v7
        with:
          node-version-file: UnifiedMozaic/package.json

      # Xcode の clang でビルドする。UM の CI と同じく、Homebrew の LLVM と lld も入れておく（UM が wasm32 に使う）
      - name: LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm lld

      # --- ライブラリ（Windows はここで LLVM も入れる） ---
      - name: deps path
        run: echo "UM_DEPS=$HOME/mozcut-deps" >> "$GITHUB_ENV"
      - id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/mozcut-deps
          key: mozcut-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MozaicCut/.github/ci/install-deps.sh') }}
      - name: deps
        run: bash .github/ci/install-deps.sh
      - if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/mozcut-deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # --- 配布の形 ---
      - name: package
        env:
          # 版（Info.plist）。タグ v1.2.3 から動かしたときは 1.2.3、それ以外は package.mjs の既定
          MOZCUT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          MOZCUT_BUILD_PRIORITY: normal
        run: |
          export MOZCUT_VERSION="${MOZCUT_VERSION#v}"
          [ -n "$MOZCUT_VERSION" ] || unset MOZCUT_VERSION
          node tools/mozcut.mjs package

      # upload-artifact は実行の許可と記号のリンクを残さないので、.app は ditto で zip にして置く（署名も保たれる）
      - name: zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MozaicCut.app dist/MozaicCut-macos-arm64.zip

      # Release に置く Windows の zip（中は MozaicCut/ のフォルダ 1 つ）。タグのときだけ作る
      - name: zip (Windows, tag)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: cd dist && 7z a -tzip -mx=9 MozaicCut-windows-x64.zip MozaicCut
      - name: upload zip (Windows, tag)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: MozaicCut/dist/MozaicCut-windows-x64.zip
          if-no-files-found: error

      - name: upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MozaicCut-${{ matrix.name }}
          path: MozaicCut/dist/MozaicCut/
          if-no-files-found: error
      - name: upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MozaicCut-${{ matrix.name }}
          path: MozaicCut/dist/MozaicCut-macos-arm64.zip
          if-no-files-found: error

  # タグ v* のときだけ、両方の package が通ったら GitHub Release を作る。
  # 置くもの（自動更新がこの名前に頼るので変えない）: MozaicCut-windows-x64.zip・MozaicCut-macos-arm64.zip・SHA256SUMS.txt
  # 本文は CHANGELOG.md のその版の節（「## [1.2.3]」から次の「## 」の前まで）。節がなければ止める。
  # v1.2.3-beta.1 のような「-」の付いたタグは、プレリリース（prerelease）にする。
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: version
        id: ver
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::タグ $tag は vX.Y.Z か vX.Y.Z-beta.N の形ではありません"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: notes (CHANGELOG.md)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" '
            index($0, "## ") == 1 { if (on) exit; if ($0 == h || index($0, h " ") == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md に「## [$VERSION]」の節がありません"
            exit 1
          fi
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: MozaicCut-macos-arm64
          path: assets

      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum MozaicCut-windows-x64.zip MozaicCut-macos-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "MozaicCut $VERSION" --notes-file notes.md "${pre[@]}" \
            assets/MozaicCut-windows-x64.zip assets/MozaicCut-macos-arm64.zip assets/SHA256SUMS.txt
